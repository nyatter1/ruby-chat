<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ruby Market</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gray: { 850: '#1f2937', 900: '#111827', 950: '#030712' },
                        ruby: { 500: '#e0115f', 600: '#c20e50', 900: '#830a2e' },
                        gold: { 400: '#fbbf24', 500: '#f59e0b' }
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'unlock': 'unlockAnim 0.6s ease-out forwards'
                    },
                    keyframes: {
                        unlockAnim: {
                            '0%': { transform: 'scale(1)', filter: 'blur(12px)' },
                            '50%': { transform: 'scale(1.05)', filter: 'blur(6px)' },
                            '100%': { transform: 'scale(1)', filter: 'blur(0px)' }
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #050505; color: white; -webkit-tap-highlight-color: transparent; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }

        .glass-panel {
            background: rgba(20, 20, 20, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .blurred-content {
            filter: blur(24px);
            transform: scale(1.1); /* Prevent blurred edges from showing white */
            transition: filter 0.5s ease, transform 0.5s ease;
        }

        .unlocked .blurred-content {
            filter: blur(0);
            transform: scale(1);
        }

        .lock-overlay {
            background: radial-gradient(circle, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.8) 100%);
            transition: opacity 0.3s ease;
        }

        .loader {
            border: 3px solid rgba(224, 17, 95, 0.1);
            border-left-color: #e0115f;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans">

    <!-- Navbar -->
    <nav class="fixed top-0 w-full z-50 glass-panel h-16 px-4 flex justify-between items-center">
        <a href="index.html" class="flex items-center gap-2 text-gray-400 hover:text-white transition-colors">
            <i class="fas fa-chevron-left"></i> <span class="font-bold text-sm">Chat</span>
        </a>
        
        <div class="flex items-center gap-2">
            <i class="fas fa-gem text-ruby-500 text-lg"></i>
            <h1 class="font-bold text-xl tracking-wide bg-gradient-to-r from-white to-gray-400 bg-clip-text text-transparent">MARKET</h1>
        </div>

        <div class="flex items-center gap-3 bg-gray-900/80 px-3 py-1.5 rounded-full border border-gray-800">
            <i class="fas fa-coins text-gold-400"></i>
            <span id="wallet-balance" class="font-mono font-bold text-gold-400">...</span>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 pt-20 pb-24 px-4 container mx-auto max-w-2xl">
        
        <!-- Action Bar -->
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-gray-400 text-sm font-uppercase tracking-wider font-bold">LATEST DROPS</h2>
            <button onclick="openUploadModal()" class="bg-ruby-500 hover:bg-ruby-600 text-white px-4 py-2 rounded-lg font-bold text-sm shadow-lg shadow-ruby-500/20 transition-all flex items-center gap-2">
                <i class="fas fa-plus"></i> SELL ITEM
            </button>
        </div>

        <!-- Grid -->
        <div id="market-grid" class="grid grid-cols-2 gap-4">
            <!-- Items injected via JS -->
            <div class="col-span-2 py-20 flex flex-col items-center justify-center text-gray-600">
                <div class="loader mb-4"></div>
                <p>Loading Market...</p>
            </div>
        </div>
    </main>

    <!-- Upload Modal -->
    <div id="upload-modal" class="fixed inset-0 z-[60] bg-black/90 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-gray-800 rounded-2xl w-full max-w-md overflow-hidden flex flex-col max-h-[90vh]">
            <div class="p-4 border-b border-gray-800 flex justify-between items-center">
                <h3 class="font-bold text-lg">Sell Content</h3>
                <button onclick="closeUploadModal()" class="text-gray-400 hover:text-white"><i class="fas fa-times"></i></button>
            </div>
            
            <div class="p-6 overflow-y-auto space-y-6">
                <!-- Image Select -->
                <div class="space-y-2">
                    <label class="block text-xs font-bold text-gray-500 uppercase">Image (Hidden until bought)</label>
                    <div onclick="document.getElementById('file-input').click()" id="upload-zone" class="aspect-square w-full rounded-xl border-2 border-dashed border-gray-700 bg-gray-800/50 hover:bg-gray-800 transition-colors flex flex-col items-center justify-center cursor-pointer relative overflow-hidden group">
                        <div id="upload-prompt" class="text-center">
                            <i class="fas fa-image text-3xl text-gray-500 mb-2 group-hover:text-ruby-500 transition-colors"></i>
                            <p class="text-sm text-gray-400 font-bold">Tap to upload</p>
                        </div>
                        <img id="upload-preview" class="absolute inset-0 w-full h-full object-cover hidden">
                        <input type="file" id="file-input" accept="image/*" class="hidden" onchange="handleFileSelect(this)">
                    </div>
                </div>

                <!-- Details -->
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Title</label>
                        <input type="text" id="item-title" class="w-full bg-black border border-gray-700 rounded-lg px-4 py-3 text-white focus:border-ruby-500 outline-none" placeholder="Mystery Box #1">
                    </div>
                    
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Price (Coins)</label>
                        <div class="relative">
                            <i class="fas fa-coins absolute left-4 top-1/2 transform -translate-y-1/2 text-gold-400"></i>
                            <input type="number" id="item-price" class="w-full bg-black border border-gray-700 rounded-lg pl-10 pr-4 py-3 text-white focus:border-ruby-500 outline-none font-mono" placeholder="50">
                        </div>
                        <p class="text-xs text-gray-600 mt-2">You will receive 100% of the sale.</p>
                    </div>
                </div>
            </div>

            <div class="p-4 border-t border-gray-800 bg-black/50">
                <button id="btn-publish" onclick="publishItem()" class="w-full bg-ruby-500 hover:bg-ruby-600 text-white font-bold py-3 rounded-xl transition-all disabled:opacity-50 disabled:cursor-not-allowed">
                    LIST FOR SALE
                </button>
            </div>
        </div>
    </div>

    <!-- Fullscreen Image Viewer (For Unlocked Items) -->
    <div id="image-viewer" class="fixed inset-0 z-[70] bg-black hidden flex items-center justify-center" onclick="closeImageViewer()">
        <img id="viewer-img" src="" class="max-w-full max-h-full object-contain">
        <button class="absolute top-4 right-4 text-white text-2xl p-4"><i class="fas fa-times"></i></button>
    </div>

    <!-- Notification Toast -->
    <div id="toast-container" class="fixed top-20 left-1/2 transform -translate-x-1/2 z-[100] flex flex-col gap-2 pointer-events-none w-full max-w-sm px-4"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
        import { getFirestore, collection, doc, addDoc, getDoc, updateDoc, onSnapshot, query, orderBy, limit, serverTimestamp, runTransaction, arrayUnion } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        const config = {apiKey:"AIzaSyC-Ti6kJB_bgdeC0I_1Pt9Bl3XZp7pTjoU",authDomain:"cartoony-chat.firebaseapp.com",databaseURL:"https://cartoony-chat-default-rtdb.europe-west1.firebasedatabase.app",projectId:"cartoony-chat",storageBucket:"cartoony-chat.firebasestorage.app",messagingSenderId:"827018960215",appId:"1:827018960215:web:0e0c2436c9c4e1dceb7212",measurementId:"G-HF16NJSQ16"};
        const app = initializeApp(config);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let userBalance = 0;

        // Auth & Wallet Listener
        onAuthStateChanged(auth, async (u) => {
            if (u) {
                currentUser = u;
                // Listen to user's wallet
                onSnapshot(doc(db, "users", u.uid), (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        // Initialize wallet if it doesn't exist
                        userBalance = data.coins !== undefined ? data.coins : 100; // Default 100 coins
                        document.getElementById('wallet-balance').innerText = userBalance;
                        
                        if (data.coins === undefined) {
                            updateDoc(doc(db, "users", u.uid), { coins: 100 });
                        }
                    }
                });
                loadMarket();
            } else {
                window.location.href = 'index.html';
            }
        });

        // Market Feed
        function loadMarket() {
            const q = query(collection(db, "market_items"), orderBy("timestamp", "desc"), limit(50));
            onSnapshot(q, (snapshot) => {
                const grid = document.getElementById('market-grid');
                if (snapshot.empty) {
                    grid.innerHTML = '<div class="col-span-2 text-center text-gray-500 py-10">No items for sale yet.</div>';
                    return;
                }
                
                grid.innerHTML = snapshot.docs.map(doc => {
                    const item = { id: doc.id, ...doc.data() };
                    return renderCard(item);
                }).join('');
            });
        }

        function renderCard(item) {
            const isOwner = item.sellerUid === currentUser.uid;
            const isUnlocked = isOwner || (item.buyers && item.buyers.includes(currentUser.uid));
            
            return `
            <div class="relative group bg-gray-900 rounded-xl overflow-hidden border border-gray-800 shadow-lg ${isUnlocked ? 'unlocked' : ''}" id="card-${item.id}">
                <div class="aspect-square relative overflow-hidden bg-gray-950 cursor-pointer" onclick="${isUnlocked ? `openViewer('${item.imageUrl}')` : ''}">
                    <img src="${item.imageUrl}" class="w-full h-full object-cover blurred-content">
                    
                    ${!isUnlocked ? `
                    <div class="absolute inset-0 lock-overlay flex flex-col items-center justify-center p-4 text-center z-10">
                        <i class="fas fa-lock text-3xl text-white/50 mb-2"></i>
                        <div class="text-xs font-bold text-gray-300 uppercase tracking-wider mb-3">Hidden Content</div>
                        <button onclick="buyItem('${item.id}', ${item.price}, '${item.sellerUid}')" class="bg-white text-black hover:bg-gray-200 font-bold py-2 px-4 rounded-full text-sm flex items-center gap-1 transition-transform active:scale-95 shadow-lg shadow-white/10">
                            Unlock <span class="text-ruby-600 mx-1">•</span> ${item.price}
                        </button>
                    </div>` : ''}

                    ${isOwner ? `<div class="absolute top-2 right-2 bg-black/60 text-white text-[10px] font-bold px-2 py-1 rounded backdrop-blur-sm">YOU SELLER</div>` : ''}
                    ${isUnlocked && !isOwner ? `<div class="absolute top-2 right-2 bg-green-500/80 text-white text-[10px] font-bold px-2 py-1 rounded backdrop-blur-sm"><i class="fas fa-check"></i> OWNED</div>` : ''}
                </div>
                
                <div class="p-3">
                    <div class="flex justify-between items-start mb-1">
                        <h3 class="font-bold text-sm truncate pr-2 text-gray-200">${esc(item.title)}</h3>
                        ${!isUnlocked ? `<span class="text-xs font-mono text-gold-400 font-bold flex-shrink-0"><i class="fas fa-coins text-[10px]"></i> ${item.price}</span>` : ''}
                    </div>
                    <div class="flex justify-between items-center mt-2">
                        <div class="flex items-center gap-1.5">
                            <img src="https://ui-avatars.com/api/?name=${item.sellerName}&background=random" class="w-4 h-4 rounded-full">
                            <span class="text-[10px] text-gray-500 font-bold truncate max-w-[80px]">${esc(item.sellerName)}</span>
                        </div>
                        <div class="text-[10px] text-gray-600">${item.buyers ? item.buyers.length : 0} unlocked</div>
                    </div>
                </div>
            </div>`;
        }

        // Logic
        window.buyItem = async (itemId, price, sellerUid) => {
            if (userBalance < price) {
                showToast("Insufficient coins!", true);
                return;
            }

            if (!confirm(`Unlock this for ${price} coins?`)) return;

            const card = document.getElementById(`card-${itemId}`);
            const btn = card.querySelector('button');
            const originalBtn = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            btn.disabled = true;

            try {
                await runTransaction(db, async (transaction) => {
                    // 1. Read fresh User Data
                    const userRef = doc(db, "users", currentUser.uid);
                    const userDoc = await transaction.get(userRef);
                    if (!userDoc.exists()) throw "User error";
                    const currentCoins = userDoc.data().coins || 0;

                    if (currentCoins < price) throw "Not enough coins!";

                    // 2. Read Seller Data (to pay them)
                    const sellerRef = doc(db, "users", sellerUid);
                    
                    // 3. Read Item Data (to add buyer)
                    const itemRef = doc(db, "market_items", itemId);
                    
                    // Writes
                    transaction.update(userRef, { coins: currentCoins - price });
                    transaction.update(sellerRef, { coins: (await transaction.get(sellerRef)).data().coins + price });
                    transaction.update(itemRef, { buyers: arrayUnion(currentUser.uid) });
                });

                showToast("Item Unlocked!");
                // The onSnapshot will update the UI automatically
            } catch (e) {
                console.error(e);
                showToast(e === "Not enough coins!" ? e : "Transaction failed", true);
                btn.innerHTML = originalBtn;
                btn.disabled = false;
            }
        };

        // Upload Logic
        window.openUploadModal = () => document.getElementById('upload-modal').classList.remove('hidden');
        window.closeUploadModal = () => {
            document.getElementById('upload-modal').classList.add('hidden');
            resetUploadForm();
        };

        window.handleFileSelect = (input) => {
            const file = input.files[0];
            if (file) {
                // Client-side compression
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        const MAX_SIZE = 800;
                        
                        if (width > height) {
                            if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; }
                        } else {
                            if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
                        }
                        
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        // Output JPEG at 0.7 quality
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
                        
                        document.getElementById('upload-preview').src = dataUrl;
                        document.getElementById('upload-preview').classList.remove('hidden');
                        document.getElementById('upload-prompt').classList.add('hidden');
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        };

        window.publishItem = async () => {
            const title = document.getElementById('item-title').value.trim();
            const price = parseInt(document.getElementById('item-price').value);
            const imgData = document.getElementById('upload-preview').src;

            if (!title || !price || !imgData || document.getElementById('upload-preview').classList.contains('hidden')) {
                showToast("Please fill all fields", true);
                return;
            }

            const btn = document.getElementById('btn-publish');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> PUBLISHING...';
            btn.disabled = true;

            try {
                // Get username safely
                const userDoc = await getDoc(doc(db, "users", currentUser.uid));
                const username = userDoc.exists() ? userDoc.data().username : "Anonymous";

                await addDoc(collection(db, "market_items"), {
                    title: title,
                    price: price,
                    imageUrl: imgData,
                    sellerUid: currentUser.uid,
                    sellerName: username,
                    timestamp: serverTimestamp(),
                    buyers: []
                });

                showToast("Item listed for sale!");
                closeUploadModal();
            } catch (e) {
                console.error(e);
                showToast("Error publishing item", true);
            } finally {
                btn.innerHTML = 'LIST FOR SALE';
                btn.disabled = false;
            }
        };

        function resetUploadForm() {
            document.getElementById('item-title').value = '';
            document.getElementById('item-price').value = '';
            document.getElementById('file-input').value = '';
            document.getElementById('upload-preview').src = '';
            document.getElementById('upload-preview').classList.add('hidden');
            document.getElementById('upload-prompt').classList.remove('hidden');
        }

        // Viewers
        window.openViewer = (src) => {
            document.getElementById('viewer-img').src = src;
            document.getElementById('image-viewer').classList.remove('hidden');
        };
        window.closeImageViewer = () => document.getElementById('image-viewer').classList.add('hidden');

        // Utils
        window.showToast = (msg, isError = false) => {
            const container = document.getElementById('toast-container');
            const el = document.createElement('div');
            el.className = `p-4 rounded-xl shadow-2xl backdrop-blur-md text-sm font-bold flex items-center gap-3 transition-all transform translate-y-2 opacity-0 ${isError ? 'bg-red-500/90 text-white' : 'bg-white/90 text-black'}`;
            el.innerHTML = `<i class="fas ${isError ? 'fa-exclamation-circle' : 'fa-check-circle'}"></i> ${msg}`;
            container.appendChild(el);
            
            // Animation frame for transition
            requestAnimationFrame(() => {
                el.classList.remove('translate-y-2', 'opacity-0');
            });

            setTimeout(() => {
                el.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => el.remove(), 300);
            }, 3000);
        };

        function esc(t) { return t ? t.replace(/[&<>"']/g, x => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[x])) : ''; }
    </script>
</body>
</html>
