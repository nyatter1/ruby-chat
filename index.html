<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruby Chat</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gray: {
                            850: '#1f2937',
                            900: '#111827',
                            950: '#030712',
                        },
                        ruby: {
                            500: '#e0115f',
                            600: '#c20e50'
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #111827; 
        }
        ::-webkit-scrollbar-thumb {
            background: #374151; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4b5563; 
        }
        
        /* Rank Badge Style */
        .rank-badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .rank-img {
            height: 20px;
            margin-right: 4px;
        }
        
        .msg-bubble {
            max-width: 85%;
            word-wrap: break-word;
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 font-sans h-screen overflow-hidden selection:bg-ruby-500 selection:text-white">

    <!-- Auth Container -->
    <div id="auth-container" class="fixed inset-0 z-50 flex items-center justify-center bg-gray-950 bg-opacity-95 hidden">
        <div class="bg-gray-900 p-8 rounded-xl shadow-2xl border border-gray-800 w-full max-w-md relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-ruby-500"></div>
            <h1 class="text-3xl font-bold text-center mb-6 text-ruby-500 tracking-wider">RUBY CHAT</h1>
            
            <!-- Login Form -->
            <form id="login-form" class="space-y-4">
                <h2 class="text-xl font-semibold mb-4 text-gray-300">Login</h2>
                <input type="email" id="login-email" placeholder="Email" class="w-full bg-gray-950 border border-gray-700 p-3 rounded text-white focus:border-ruby-500 focus:outline-none transition-colors" required>
                <input type="password" id="login-password" placeholder="Password" class="w-full bg-gray-950 border border-gray-700 p-3 rounded text-white focus:border-ruby-500 focus:outline-none transition-colors" required>
                <button type="submit" class="w-full bg-ruby-500 hover:bg-ruby-600 text-white font-bold p-3 rounded transition-colors shadow-lg shadow-ruby-500/20">ENTER WORLD</button>
                <p class="text-center text-sm text-gray-400 cursor-pointer hover:text-white mt-4" onclick="toggleAuthMode()">Don't have an account? <span class="text-ruby-500">Sign Up</span></p>
            </form>

            <!-- Signup Form -->
            <form id="signup-form" class="space-y-4 hidden">
                <h2 class="text-xl font-semibold mb-4 text-gray-300">Join the Community</h2>
                <input type="text" id="signup-username" placeholder="Username" class="w-full bg-gray-950 border border-gray-700 p-3 rounded text-white focus:border-ruby-500 focus:outline-none transition-colors" required>
                <input type="email" id="signup-email" placeholder="Email" class="w-full bg-gray-950 border border-gray-700 p-3 rounded text-white focus:border-ruby-500 focus:outline-none transition-colors" required>
                <input type="password" id="signup-password" placeholder="Password" class="w-full bg-gray-950 border border-gray-700 p-3 rounded text-white focus:border-ruby-500 focus:outline-none transition-colors" required>
                <button type="submit" class="w-full bg-ruby-500 hover:bg-ruby-600 text-white font-bold p-3 rounded transition-colors shadow-lg shadow-ruby-500/20">CREATE ACCOUNT</button>
                <p class="text-center text-sm text-gray-400 cursor-pointer hover:text-white mt-4" onclick="toggleAuthMode()">Already a member? <span class="text-ruby-500">Login</span></p>
            </form>
        </div>
    </div>

    <!-- Main App -->
    <div id="app-container" class="flex h-screen hidden relative">
        
        <!-- Mobile Menu Overlay -->
        <div id="mobile-menu-overlay" class="fixed inset-0 bg-black/80 z-20 hidden md:hidden" onclick="toggleMobileMenu()"></div>

        <!-- Chat Area -->
        <div class="flex-1 flex flex-col h-full relative z-0">
            <!-- Header -->
            <header class="h-16 bg-gray-900 border-b border-gray-800 flex items-center justify-between px-4 shrink-0">
                <div class="flex items-center gap-3">
                    <button class="md:hidden text-gray-400 hover:text-white" onclick="toggleMobileMenu()">
                        <i class="fas fa-bars text-xl"></i>
                    </button>
                    <h1 class="text-xl font-bold tracking-tight"><span class="text-ruby-500">Ruby</span>Chat</h1>
                </div>
                <div class="flex items-center gap-3">
                    <button onclick="copyInviteLink()" class="bg-gray-800 hover:bg-gray-700 text-xs px-3 py-1.5 rounded border border-gray-700 transition-colors">
                        <i class="fas fa-link mr-1"></i> Invite
                    </button>
                    <div class="relative group cursor-pointer" onclick="openProfile(currentUser.uid)">
                        <img id="header-avatar" src="https://picsum.photos/40/40" class="w-9 h-9 rounded-full border border-gray-600 object-cover bg-gray-800">
                        <div class="w-2.5 h-2.5 bg-green-500 rounded-full absolute bottom-0 right-0 border border-gray-900"></div>
                    </div>
                </div>
            </header>

            <!-- Chat Messages -->
            <div id="chat-feed" class="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-950 scroll-smooth">
                <!-- Messages injected here -->
                <div class="text-center text-gray-500 mt-10">Loading chat...</div>
            </div>

            <!-- Input Area -->
            <div class="bg-gray-900 border-t border-gray-800 p-4 shrink-0">
                <form id="message-form" class="flex items-center gap-2 max-w-5xl mx-auto">
                    <input type="text" id="message-input" autocomplete="off" placeholder="Type a message..." class="flex-1 bg-gray-950 border border-gray-700 text-gray-100 rounded-full px-5 py-3 focus:outline-none focus:border-ruby-500 transition-all">
                    <button type="submit" class="bg-ruby-500 hover:bg-ruby-600 text-white w-12 h-12 rounded-full flex items-center justify-center transition-transform hover:scale-105 shadow-lg shadow-ruby-500/20">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </form>
            </div>
        </div>

        <!-- Right Sidebar (Online Users) -->
        <div id="right-sidebar" class="w-72 bg-gray-900 border-l border-gray-800 flex-col absolute md:relative right-0 h-full z-30 transform translate-x-full md:translate-x-0 transition-transform duration-300 flex">
            <div class="p-4 border-b border-gray-800 bg-gray-850 flex justify-between items-center">
                <h3 class="font-bold text-gray-200"><i class="fas fa-users text-ruby-500 mr-2"></i>Online</h3>
                <span id="online-count" class="bg-gray-800 text-xs px-2 py-1 rounded-full text-gray-400">0</span>
                <button class="md:hidden text-gray-400" onclick="toggleMobileMenu()"><i class="fas fa-times"></i></button>
            </div>
            <div id="user-list" class="flex-1 overflow-y-auto p-2 space-y-1">
                <!-- User list items -->
            </div>
            
            <!-- Admin Button -->
            <div id="admin-panel-btn-container" class="p-3 border-t border-gray-800 hidden">
                <button onclick="openAdminPanel()" class="w-full bg-gray-800 hover:bg-gray-700 text-ruby-500 font-bold py-2 px-4 rounded border border-gray-700 transition-colors">
                    <i class="fas fa-shield-alt mr-2"></i>Admin Panel
                </button>
            </div>
        </div>
    </div>

    <!-- Profile Modal -->
    <div id="profile-modal" class="fixed inset-0 z-40 bg-black/80 hidden flex items-center justify-center p-4">
        <div class="bg-gray-900 rounded-xl w-full max-w-lg border border-gray-700 shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <!-- Modal Header / Banner -->
            <div class="relative h-32 bg-gray-800 cursor-pointer group" onclick="if(isEditingProfile) triggerBannerUpload()">
                <img id="profile-banner-img" src="https://picsum.photos/600/200" class="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition-opacity">
                <div class="absolute inset-0 flex items-center justify-center bg-black/30 opacity-0 group-hover:opacity-100 transition-opacity edit-overlay hidden">
                    <i class="fas fa-camera text-white text-2xl drop-shadow-lg"></i>
                </div>
                <button onclick="closeProfile()" class="absolute top-2 right-2 bg-black/50 text-white w-8 h-8 rounded-full flex items-center justify-center hover:bg-red-500 transition-colors z-10"><i class="fas fa-times"></i></button>
            </div>

            <!-- Profile Info -->
            <div class="px-6 pb-6 -mt-12 flex flex-col items-center relative overflow-y-auto">
                <!-- Avatar -->
                <div class="relative mb-3 group cursor-pointer" onclick="if(isEditingProfile) triggerAvatarUpload()">
                    <img id="profile-avatar-img" src="https://picsum.photos/100/100" class="w-24 h-24 rounded-full border-4 border-gray-900 object-cover bg-gray-800">
                    <div class="absolute inset-0 rounded-full flex items-center justify-center bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity edit-overlay hidden">
                        <i class="fas fa-camera text-white drop-shadow-lg"></i>
                    </div>
                </div>

                <!-- View Mode Data -->
                <div id="profile-view-mode" class="text-center w-full">
                    <h2 id="profile-username" class="text-2xl font-bold text-white mb-1">User</h2>
                    <div id="profile-rank-badge" class="mb-4 flex justify-center">
                        <!-- Rank Badge -->
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4 w-full mb-6">
                        <div class="bg-gray-800 p-3 rounded-lg border border-gray-700 text-center">
                            <div class="text-xs text-gray-400 uppercase tracking-wide">Messages</div>
                            <div id="profile-stats-msgs" class="text-xl font-bold text-ruby-500">0</div>
                        </div>
                        <div class="bg-gray-800 p-3 rounded-lg border border-gray-700 text-center">
                            <div class="text-xs text-gray-400 uppercase tracking-wide">Invites</div>
                            <div id="profile-stats-invites" class="text-xl font-bold text-blue-400">0</div>
                        </div>
                    </div>

                    <button id="edit-profile-btn" onclick="toggleProfileEdit()" class="hidden w-full bg-gray-800 hover:bg-gray-700 text-white font-bold py-2 rounded border border-gray-600 transition-colors">
                        Edit Profile
                    </button>
                    <div id="private-msg-container" class="w-full mt-2 hidden">
                        <button onclick="startPrivateChat()" class="w-full bg-ruby-500 hover:bg-ruby-600 text-white font-bold py-2 rounded transition-colors shadow-lg shadow-ruby-500/20">
                            <i class="fas fa-envelope mr-2"></i>Send Message
                        </button>
                    </div>
                </div>

                <!-- Edit Mode Data -->
                <div id="profile-edit-mode" class="w-full hidden space-y-4">
                    <div>
                        <label class="text-xs text-gray-400 uppercase font-bold block mb-1">Username</label>
                        <input type="text" id="edit-username-input" class="w-full bg-gray-950 border border-gray-700 p-2 rounded text-white focus:border-ruby-500 focus:outline-none">
                    </div>
                    <div class="flex gap-2 mt-4">
                        <button onclick="saveProfileChanges()" class="flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-2 rounded">Save</button>
                        <button onclick="toggleProfileEdit()" class="flex-1 bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 rounded">Cancel</button>
                    </div>
                </div>

                <!-- Hidden File Inputs -->
                <input type="file" id="avatar-upload" accept="image/*" class="hidden">
                <input type="file" id="banner-upload" accept="image/*" class="hidden">
            </div>
        </div>
    </div>

    <!-- Admin Modal -->
    <div id="admin-modal" class="fixed inset-0 z-50 bg-black/90 hidden flex flex-col p-4 md:p-10">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-3xl font-bold text-ruby-500"><i class="fas fa-cogs mr-3"></i>Admin Panel</h2>
            <button onclick="closeAdminPanel()" class="text-gray-400 hover:text-white text-2xl"><i class="fas fa-times"></i></button>
        </div>
        <div class="bg-gray-900 border border-gray-800 rounded-xl flex-1 overflow-hidden flex flex-col">
            <div class="p-4 border-b border-gray-800 bg-gray-850 flex gap-4">
                <input type="text" id="admin-search" placeholder="Search users..." class="bg-gray-950 border border-gray-700 rounded px-3 py-2 text-white w-full max-w-sm focus:border-ruby-500 focus:outline-none">
            </div>
            <div class="flex-1 overflow-y-auto p-0">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-gray-800 text-gray-400 text-xs uppercase sticky top-0">
                        <tr>
                            <th class="p-4">User</th>
                            <th class="p-4">Rank</th>
                            <th class="p-4 text-center">Stats</th>
                            <th class="p-4 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="admin-user-table" class="divide-y divide-gray-800">
                        <!-- Admin rows -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, limit, onSnapshot, doc, setDoc, getDoc, updateDoc, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        // --- Configuration ---
        const firebaseConfig = {
            apiKey: "AIzaSyC-Ti6kJB_bgdeC0I_1Pt9Bl3XZp7pTjoU",
            authDomain: "cartoony-chat.firebaseapp.com",
            databaseURL: "https://cartoony-chat-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "cartoony-chat",
            storageBucket: "cartoony-chat.appspot.com",
            messagingSenderId: "827018960215",
            appId: "1:827018960215:web:d7099f743933ff23eb7212",
            measurementId: "G-D1MLP59001"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        /* 
           FIRESTORE RULES (Reference):
           rules_version = '2';
           service cloud.firestore {
             match /databases/{database}/documents {
               match /users/{userId} {
                 allow read: if request.auth != null;
                 allow write: if request.auth != null && request.auth.uid == userId;
                 // Allow admin write logic would be here ideally
               }
               match /messages/{messageId} {
                 allow read: if request.auth != null;
                 allow create: if request.auth != null;
               }
               // Admin override would require custom claims or looking up admin doc
             }
           }
        */

        // --- Rank System ---
        // Ordered from highest priority to lowest
        const RANKS = [
            { name: "Developer", img: "developer.gif", msgs: 0, invites: 50, isStaff: true },
            { name: "Founder", img: "founder.gif", msgs: 0, invites: 45, isStaff: true },
            { name: "CEO", img: "CEO.gif", msgs: 0, invites: 40, isStaff: true },
            { name: "Head Owner", img: "head-owner.gif", msgs: 0, invites: 35, isStaff: true },
            { name: "Owner", img: "owner.gif", msgs: 0, invites: 30, isStaff: true },
            { name: "Manager", img: "manager.gif", msgs: 0, invites: 25, isStaff: true },
            { name: "Super Admin", img: "super-admin.png", msgs: 0, invites: 20, isStaff: true },
            { name: "Admin", img: "admin.png", msgs: 0, invites: 15, isStaff: true },
            { name: "Moderator", img: "mod.png", msgs: 0, invites: 10, isStaff: true },
            { name: "Trial Mod", img: "trial-mod.png", msgs: 0, invites: 5, isStaff: true },
            { name: "Site Helper", img: "site-helper.gif", msgs: 0, invites: 3, isStaff: true },
            { name: "Staff", img: "st.gif", msgs: 0, invites: 0, isStaff: true },
            // Msg Ranks
            { name: "Bean", img: "bean.png", msgs: 57000, invites: 0 },
            { name: "Heart 4", img: "heart4.gif", msgs: 54500, invites: 0 },
            { name: "Heart 3", img: "heart3.gif", msgs: 52000, invites: 0 },
            { name: "Heart 2", img: "heart2.gif", msgs: 49500, invites: 0 },
            { name: "Heart 1", img: "heart1.gif", msgs: 47000, invites: 0 },
            { name: "IDK", img: "idk.gif", msgs: 44500, invites: 0 },
            { name: "Luck", img: "luck.gif", msgs: 42000, invites: 0 },
            { name: "Banana", img: "banana.gif", msgs: 39500, invites: 0 },
            { name: "Snail", img: "snail.gif", msgs: 37000, invites: 0 },
            { name: "Teddy", img: "teddy.gif", msgs: 34500, invites: 0 },
            { name: "Kirby", img: "kirby.gif", msgs: 32000, invites: 0 },
            { name: "Homer", img: "homer.gif", msgs: 29500, invites: 0 },
            { name: "Ghost", img: "ghost.gif", msgs: 27000, invites: 0 },
            { name: "Scooby 2", img: "scooby2.gif", msgs: 24500, invites: 0 },
            { name: "Scooby", img: "scooby.gif", msgs: 22000, invites: 0 },
            { name: "Batman 3", img: "batman3.gif", msgs: 19500, invites: 0 },
            { name: "Batman 2", img: "batman2.gif", msgs: 17000, invites: 0 },
            { name: "Batman", img: "batman.gif", msgs: 14500, invites: 0 },
            { name: "Princess", img: "princess.gif", msgs: 12000, invites: 0 },
            { name: "Premium", img: "premium.gif", msgs: 9500, invites: 0 },
            { name: "Mega VIP", img: "mega-vip.gif", msgs: 7000, invites: 0 },
            { name: "Elite", img: "elite.png", msgs: 5000, invites: 0 },
            { name: "Mega Elite", img: "mega-elite.gif", msgs: 3500, invites: 0 },
            { name: "Coding", img: "coding.gif", msgs: 2000, invites: 0 },
            { name: "Bot", img: "bot1.gif", msgs: 1000, invites: 0 },
            { name: "VIP", img: "vip.gif", msgs: 0, invites: 0 }
        ];

        // --- State ---
        let currentUser = null;
        let userData = null;
        let isEditingProfile = false;
        let viewingUserId = null;
        let allUsersCache = [];
        
        // --- Helper: Get Rank ---
        function getRankData(rankName) {
            return RANKS.find(r => r.name === rankName) || RANKS[RANKS.length - 1];
        }

        function calculateRank(currentData) {
            // Keep existing rank if it is a staff rank (manually assigned or high invites)
            // Unless we are implementing auto-demote, but typically manual ranks are sticky.
            // For this logic, we will check highest QUALIFIED rank based on stats.
            // However, to allow manual overrides, we should respect the DB rank unless the calculated rank is HIGHER and is an auto-rank.
            
            // Simple logic: Find the highest rank the user qualifies for based on stats.
            // Priority: Invites (Staff) > Messages.
            
            // Note: The prompt implies manual promotion too.
            // We will return the current rank if no automatic upgrade is found, or upgrade.
            
            // For now, let's just stick to the database rank, and only update it if we detect a threshold cross.
            // But to keep it robust:
            // 1. Check if user meets reqs for a higher message rank than current.
            
            let qualifiedRank = RANKS[RANKS.length - 1]; // Default VIP
            
            // Check invite ranks
            for (const r of RANKS) {
                if (r.invites > 0 && currentData.invites >= r.invites) {
                    qualifiedRank = r;
                    break; // Found highest invite rank
                }
            }
            
            // If we didn't match a high invite rank (or qualifiedRank is low), check message ranks
            // Only if the current qualified rank is NOT a staff rank (so we don't downgrade a mod who hasn't chatted much)
            if (!qualifiedRank.isStaff) {
                for (const r of RANKS) {
                    if (r.msgs > 0 && currentData.messages >= r.msgs) {
                        // Check if this rank is "higher" index-wise (lower index = higher rank) than what we have
                        const qIndex = RANKS.indexOf(qualifiedRank);
                        const nIndex = RANKS.indexOf(r);
                        if (nIndex < qIndex) {
                            qualifiedRank = r;
                        }
                        break; // Sorted list, first match is highest
                    }
                }
            }
            
            return qualifiedRank.name;
        }

        // --- Auth Logic ---
        window.toggleAuthMode = () => {
            document.getElementById('login-form').classList.toggle('hidden');
            document.getElementById('signup-form').classList.toggle('hidden');
        };

        const authContainer = document.getElementById('auth-container');
        const appContainer = document.getElementById('app-container');

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                authContainer.classList.add('hidden');
                appContainer.classList.remove('hidden');
                
                // Initialize User Doc if not exists
                const userRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userRef);
                
                if (!userSnap.exists()) {
                    // Check for invite ref in URL
                    const urlParams = new URLSearchParams(window.location.search);
                    const referrerId = urlParams.get('ref');
                    
                    if (referrerId && referrerId !== user.uid) {
                        // Increment referrer invites
                        try {
                            const refUserRef = doc(db, "users", referrerId);
                            const refSnap = await getDoc(refUserRef);
                            if(refSnap.exists()) {
                                await updateDoc(refUserRef, {
                                    invites: (refSnap.data().invites || 0) + 1
                                });
                            }
                        } catch(e) { console.log("Invite error", e); }
                    }

                    await setDoc(userRef, {
                        username: user.displayName || user.email.split('@')[0],
                        email: user.email,
                        photoURL: user.photoURL || "https://picsum.photos/100/100",
                        bannerURL: "https://picsum.photos/600/200",
                        rank: "VIP",
                        messages: 0,
                        invites: 0,
                        status: "online",
                        lastSeen: serverTimestamp()
                    });
                }
                
                // Listen to own user data
                onSnapshot(userRef, (doc) => {
                    userData = doc.data();
                    updateHeaderProfile();
                    
                    // Admin Check
                    const r = getRankData(userData.rank);
                    if (r && r.isStaff) {
                        document.getElementById('admin-panel-btn-container').classList.remove('hidden');
                    } else {
                        document.getElementById('admin-panel-btn-container').classList.add('hidden');
                    }
                });
                
                // Start Presence
                updatePresence();
                setInterval(updatePresence, 60000); // Every minute
                
            } else {
                currentUser = null;
                userData = null;
                authContainer.classList.remove('hidden');
                appContainer.classList.add('hidden');
            }
        });

        async function updatePresence() {
            if(!currentUser) return;
            const userRef = doc(db, "users", currentUser.uid);
            await updateDoc(userRef, {
                status: "online",
                lastSeen: serverTimestamp()
            });
        }

        // --- Form Handlers ---
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-password').value;
            signInWithEmailAndPassword(auth, email, pass).catch(err => alert(err.message));
        });

        document.getElementById('signup-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('signup-email').value;
            const pass = document.getElementById('signup-password').value;
            const user = document.getElementById('signup-username').value;
            
            createUserWithEmailAndPassword(auth, email, pass).then(cred => {
                // Update profile display name immediately
                updateProfile(cred.user, { displayName: user });
            }).catch(err => alert(err.message));
        });

        // --- Chat Logic ---
        const chatFeed = document.getElementById('chat-feed');
        const q = query(collection(db, "messages"), orderBy("timestamp", "desc"), limit(50));
        
        onSnapshot(q, (snapshot) => {
            // Clear loading text if exists
            if(chatFeed.innerText === "Loading chat...") chatFeed.innerHTML = "";
            
            // We get messages in desc order (newest first). 
            // For chat UI we want oldest at top. Flex-col-reverse or simple reverse logic.
            // Let's just grab data, reverse, and append new ones.
            // Simpler: Just re-render visible set for this lightweight app.
            
            const msgs = [];
            snapshot.forEach(doc => msgs.push({id: doc.id, ...doc.data()}));
            msgs.reverse(); // Now Old -> New
            
            chatFeed.innerHTML = msgs.map(msg => renderMessage(msg)).join('');
            chatFeed.scrollTop = chatFeed.scrollHeight;
        });

        function renderMessage(msg) {
            const isMe = currentUser && msg.uid === currentUser.uid;
            const rankObj = getRankData(msg.rank || "VIP");
            const rankImg = rankObj ? `<img src="custom ranks/${rankObj.img}" class="rank-img" onerror="this.style.display='none'"><span class="ml-1">${rankObj.name}</span>` : msg.rank;
            
            // Format time
            const date = msg.timestamp ? new Date(msg.timestamp.toDate()) : new Date();
            const timeStr = date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

            return `
                <div class="flex gap-3 mb-4 ${isMe ? 'flex-row-reverse' : ''} group">
                    <img src="${msg.photoURL || 'https://picsum.photos/40/40'}" 
                         onclick="openProfile('${msg.uid}')"
                         class="w-10 h-10 rounded-full cursor-pointer hover:opacity-80 border border-gray-700 bg-gray-800 object-cover">
                    <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'} max-w-[80%]">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="text-xs text-gray-400 hover:text-white cursor-pointer" onclick="openProfile('${msg.uid}')">${msg.username}</span>
                            <div class="rank-badge text-gray-300 border-gray-600">${rankImg}</div>
                            <span class="text-[10px] text-gray-600">${timeStr}</span>
                        </div>
                        <div class="msg-bubble px-4 py-2 rounded-2xl text-sm ${isMe ? 'bg-ruby-500 text-white rounded-tr-none' : 'bg-gray-800 text-gray-200 rounded-tl-none border border-gray-700'}">
                            ${escapeHtml(msg.text)}
                        </div>
                    </div>
                </div>
            `;
        }

        document.getElementById('message-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text || !currentUser || !userData) return;

            input.value = '';

            try {
                // Check if rank upgrade needed based on new message count
                const newMsgCount = (userData.messages || 0) + 1;
                // Temporarily update local object to calc rank
                const tempUserData = { ...userData, messages: newMsgCount };
                const newRank = calculateRank(tempUserData);
                
                // Add Message
                await addDoc(collection(db, "messages"), {
                    text: text,
                    uid: currentUser.uid,
                    username: userData.username,
                    photoURL: userData.photoURL,
                    rank: newRank, // Stamp message with current (or new) rank
                    timestamp: serverTimestamp()
                });

                // Update User Stats
                const userRef = doc(db, "users", currentUser.uid);
                await updateDoc(userRef, {
                    messages: newMsgCount,
                    rank: newRank // Auto-update rank
                });
                
            } catch(err) {
                console.error("Msg Error", err);
            }
        });

        // --- Online Users Sidebar ---
        const userListEl = document.getElementById('user-list');
        const onlineCountEl = document.getElementById('online-count');
        
        // Listen to all users (In a real app, limit this or use a presence system. 
        // For this task, we assume small user base).
        // To filter 'online', we usually query status='online'.
        const usersQ = query(collection(db, "users"), orderBy("lastSeen", "desc"), limit(100));
        
        onSnapshot(usersQ, (snapshot) => {
            const users = [];
            const now = new Date();
            let onlineCnt = 0;
            
            snapshot.forEach(doc => {
                const d = doc.data();
                const uId = doc.id;
                // Check if active in last 5 mins
                const lastSeen = d.lastSeen ? d.lastSeen.toDate() : new Date(0);
                const isOnline = (now - lastSeen) < 5 * 60 * 1000; 
                
                if (isOnline) onlineCnt++;
                
                users.push({ uid: uId, ...d, isOnline });
            });
            
            allUsersCache = users; // For admin panel
            onlineCountEl.innerText = onlineCnt;
            
            userListEl.innerHTML = users.map(u => {
                const rankObj = getRankData(u.rank);
                return `
                <div class="flex items-center gap-3 p-2 hover:bg-gray-800 rounded cursor-pointer transition-colors" onclick="openProfile('${u.uid}')">
                    <div class="relative">
                        <img src="${u.photoURL}" class="w-8 h-8 rounded-full object-cover bg-gray-800">
                        <div class="w-2 h-2 rounded-full absolute bottom-0 right-0 border border-gray-900 ${u.isOnline ? 'bg-green-500' : 'bg-gray-500'}"></div>
                    </div>
                    <div class="overflow-hidden">
                        <div class="text-sm font-medium truncate ${u.isStaff ? 'text-ruby-500' : 'text-gray-300'}">${u.username}</div>
                        <div class="text-[10px] text-gray-500 truncate">${rankObj ? rankObj.name : u.rank}</div>
                    </div>
                </div>
                `;
            }).join('');
            
            // Update Admin Table if open
            if(!document.getElementById('admin-modal').classList.contains('hidden')) {
                renderAdminTable();
            }
        });

        // --- Profile System ---
        window.openProfile = async (uid) => {
            viewingUserId = uid;
            const modal = document.getElementById('profile-modal');
            const editBtn = document.getElementById('edit-profile-btn');
            const editOverlays = document.querySelectorAll('.edit-overlay');
            const privateMsgBtn = document.getElementById('private-msg-container');
            
            modal.classList.remove('hidden');
            
            // Reset Edit Mode
            isEditingProfile = false;
            document.getElementById('profile-view-mode').classList.remove('hidden');
            document.getElementById('profile-edit-mode').classList.add('hidden');
            editOverlays.forEach(el => el.classList.add('hidden'));

            // Fetch Data
            let data = {};
            if (currentUser && uid === currentUser.uid) {
                data = userData; // Use live local data
                editBtn.classList.remove('hidden');
                privateMsgBtn.classList.add('hidden');
            } else {
                // Fetch other user
                const snap = await getDoc(doc(db, "users", uid));
                if (snap.exists()) data = snap.data();
                editBtn.classList.add('hidden');
                if(currentUser) privateMsgBtn.classList.remove('hidden');
            }
            
            // Populate UI
            document.getElementById('profile-username').innerText = data.username || "Unknown";
            document.getElementById('profile-stats-msgs').innerText = data.messages || 0;
            document.getElementById('profile-stats-invites').innerText = data.invites || 0;
            document.getElementById('profile-avatar-img').src = data.photoURL || "https://picsum.photos/100/100";
            document.getElementById('profile-banner-img').src = data.bannerURL || "https://picsum.photos/600/200";
            
            // Rank Badge
            const rankObj = getRankData(data.rank);
            const rankHTML = rankObj 
                ? `<div class="bg-gray-800 border border-gray-600 px-3 py-1 rounded-full flex items-center gap-2">
                     <img src="custom ranks/${rankObj.img}" class="h-6" onerror="this.style.display='none'">
                     <span class="font-bold text-sm text-gray-200">${rankObj.name}</span>
                   </div>`
                : `<span class="bg-gray-800 px-3 py-1 rounded text-sm">${data.rank}</span>`;
            document.getElementById('profile-rank-badge').innerHTML = rankHTML;
            
            // Pre-fill edit inputs
            document.getElementById('edit-username-input').value = data.username;
        };
        
        window.closeProfile = () => {
            document.getElementById('profile-modal').classList.add('hidden');
        };
        
        window.toggleProfileEdit = () => {
            isEditingProfile = !isEditingProfile;
            const viewMode = document.getElementById('profile-view-mode');
            const editMode = document.getElementById('profile-edit-mode');
            const editOverlays = document.querySelectorAll('.edit-overlay');
            
            if (isEditingProfile) {
                viewMode.classList.add('hidden');
                editMode.classList.remove('hidden');
                editOverlays.forEach(el => el.classList.remove('hidden'));
            } else {
                viewMode.classList.remove('hidden');
                editMode.classList.add('hidden');
                editOverlays.forEach(el => el.classList.add('hidden'));
            }
        };

        // File Upload Handling (Base64 for simplicity in this constraints)
        function handleFileUpload(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }
        
        window.triggerAvatarUpload = () => document.getElementById('avatar-upload').click();
        window.triggerBannerUpload = () => document.getElementById('banner-upload').click();
        
        // Listeners for file inputs
        let pendingAvatar = null;
        let pendingBanner = null;

        document.getElementById('avatar-upload').addEventListener('change', async (e) => {
            if(e.target.files[0]) {
                // Show preview
                const b64 = await handleFileUpload(e.target.files[0]);
                document.getElementById('profile-avatar-img').src = b64;
                pendingAvatar = b64;
                // Ideally, compress here. Firestore 1MB limit.
            }
        });
        
        document.getElementById('banner-upload').addEventListener('change', async (e) => {
            if(e.target.files[0]) {
                const b64 = await handleFileUpload(e.target.files[0]);
                document.getElementById('profile-banner-img').src = b64;
                pendingBanner = b64;
            }
        });

        window.saveProfileChanges = async () => {
            if (!currentUser) return;
            const newName = document.getElementById('edit-username-input').value;
            const updatePayload = { username: newName };
            
            if (pendingAvatar) updatePayload.photoURL = pendingAvatar;
            if (pendingBanner) updatePayload.bannerURL = pendingBanner;
            
            try {
                await updateDoc(doc(db, "users", currentUser.uid), updatePayload);
                pendingAvatar = null;
                pendingBanner = null;
                toggleProfileEdit(); // Go back to view
            } catch(e) {
                alert("Error saving profile. Image might be too large (Firestore limit 1MB).");
                console.error(e);
            }
        };

        // --- Admin Panel ---
        window.openAdminPanel = () => {
            document.getElementById('admin-modal').classList.remove('hidden');
            renderAdminTable();
        };
        
        window.closeAdminPanel = () => {
            document.getElementById('admin-modal').classList.add('hidden');
        };

        function renderAdminTable() {
            const tbody = document.getElementById('admin-user-table');
            const search = document.getElementById('admin-search').value.toLowerCase();
            
            const filtered = allUsersCache.filter(u => 
                u.username.toLowerCase().includes(search) || u.email.toLowerCase().includes(search)
            );
            
            tbody.innerHTML = filtered.map(u => {
                // Create Rank Options
                const rankOptions = RANKS.map(r => 
                    `<option value="${r.name}" ${u.rank === r.name ? 'selected' : ''}>${r.name}</option>`
                ).join('');
                
                return `
                    <tr class="hover:bg-gray-800 transition-colors">
                        <td class="p-4">
                            <div class="flex items-center gap-3">
                                <img src="${u.photoURL}" class="w-8 h-8 rounded-full bg-gray-700">
                                <div>
                                    <div class="font-bold text-gray-200">${u.username}</div>
                                    <div class="text-xs text-gray-500">${u.email}</div>
                                </div>
                            </div>
                        </td>
                        <td class="p-4">
                            <select onchange="adminChangeRank('${u.uid}', this.value)" class="bg-gray-900 border border-gray-700 text-xs rounded p-1 text-gray-300 focus:border-ruby-500 focus:outline-none">
                                ${rankOptions}
                            </select>
                        </td>
                        <td class="p-4 text-center">
                            <div class="text-xs text-gray-400">
                                <span class="text-ruby-500 font-bold">${u.messages || 0}</span> msgs
                                <span class="mx-1">|</span>
                                <span class="text-blue-400 font-bold">${u.invites || 0}</span> inv
                            </div>
                        </td>
                        <td class="p-4 text-right">
                             <button onclick="openProfile('${u.uid}')" class="text-gray-400 hover:text-white"><i class="fas fa-eye"></i></button>
                        </td>
                    </tr>
                `;
            }).join('');
        }
        
        window.adminChangeRank = async (targetUid, newRank) => {
            if(!confirm(`Promote/Demote this user to ${newRank}?`)) return;
            try {
                await updateDoc(doc(db, "users", targetUid), { rank: newRank });
                // Re-render handled by snapshot
            } catch(e) { console.error(e); }
        };
        
        document.getElementById('admin-search').addEventListener('input', renderAdminTable);

        // --- Utils ---
        window.toggleMobileMenu = () => {
            const sidebar = document.getElementById('right-sidebar');
            const overlay = document.getElementById('mobile-menu-overlay');
            
            sidebar.classList.toggle('transform'); 
            sidebar.classList.toggle('translate-x-full');
            // Sidebar is fixed on mobile, relative on desktop. Tailwind handles this via md: classes mostly, but toggle needs care.
            // Actually, in class list above: "absolute md:relative right-0 ... transform translate-x-full md:translate-x-0"
            // So removing translate-x-full shows it.
            
            if (sidebar.classList.contains('translate-x-full')) {
                overlay.classList.add('hidden');
            } else {
                overlay.classList.remove('hidden');
            }
        };
        
        window.copyInviteLink = () => {
            if(!currentUser) return;
            const url = `${window.location.origin}${window.location.pathname}?ref=${currentUser.uid}`;
            navigator.clipboard.writeText(url);
            alert("Invite link copied to clipboard!");
        };
        
        window.updateHeaderProfile = () => {
            if(userData) {
                document.getElementById('header-avatar').src = userData.photoURL;
            }
        };
        
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
        
        window.startPrivateChat = () => {
            alert("Private messaging feature would open a separate collection query here. For this demo, please use the public chat.");
        };

    </script>
</body>
</html>
