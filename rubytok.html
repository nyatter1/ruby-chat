<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RubyTok</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={darkMode:'class',theme:{extend:{colors:{gray:{850:'#1f2937',900:'#111827',950:'#030712'},ruby:{500:'#e0115f',600:'#c20e50'}},animation:{'pulse-fast':'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite','like-bounce':'likeBounce 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)'},keyframes:{likeBounce:{'0%':{transform:'scale(1)'},'50%':{transform:'scale(1.5)'},'100%':{transform:'scale(1)'}}}}}}</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root{--acc-500:#e0115f;}
        body { background-color: #000; color: white; overflow: hidden; overscroll-behavior-y: none; }
        ::-webkit-scrollbar{width:0px;background:transparent}
        
        /* Snap Scroll Logic */
        .feed-container {
            height: 100vh;
            width: 100vw;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            position: relative;
            z-index: 10;
        }
        .video-item {
            height: 100vh;
            width: 100%;
            scroll-snap-align: start;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .video-player {
            width: 100%;
            height: 100%;
            object-fit: cover; /* TikTok style cover */
        }
        
        /* UI Elements */
        .sidebar-right { position: absolute; right: 10px; bottom: 100px; display: flex; flex-direction: column; gap: 20px; align-items: center; z-index: 20; padding-bottom: env(safe-area-inset-bottom); }
        .sidebar-icon { width: 45px; height: 45px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-shadow: 0 2px 4px rgba(0,0,0,0.5); cursor: pointer; transition: transform 0.2s; }
        .sidebar-icon:active { transform: scale(0.9); }
        .sidebar-icon i { font-size: 32px; filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5)); }
        .icon-label { font-size: 12px; font-weight: 600; margin-top: 4px; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
        
        .bottom-info { position: absolute; left: 0; bottom: 80px; width: 75%; padding: 16px; z-index: 20; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); pointer-events: none; }
        .bottom-info * { pointer-events: auto; }
        
        .nav-bottom { position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; background: rgba(0,0,0,0.9); display: flex; justify-content: space-around; align-items: center; z-index: 50; border-top: 1px solid #222; padding-bottom: env(safe-area-inset-bottom); }
        .nav-btn { color: #888; font-size: 24px; position: relative; }
        .nav-btn.active { color: white; }
        .upload-btn-container { width: 45px; height: 30px; background: linear-gradient(90deg, #0ff 0%, #f0f 100%); border-radius: 8px; display: flex; align-items: center; justify-content: center; padding: 0 3px; cursor: pointer; }
        .upload-btn-inner { width: 100%; height: 100%; background: white; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: black; font-size: 14px; }

        .disc-animation { animation: spin 5s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Modals */
        .slide-up-modal { position: fixed; bottom: 0; left: 0; width: 100%; height: 70vh; background: #111; border-radius: 20px 20px 0 0; z-index: 100; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); display: flex; flex-direction: column; }
        .slide-up-modal.open { transform: translateY(0); }
        .modal-handle { width: 40px; height: 5px; background: #444; border-radius: 10px; margin: 10px auto; }
        
        .comment-input-area { padding: 10px; background: #222; display: flex; gap: 10px; align-items: center; }

        .upload-overlay { position: fixed; inset: 0; background: #000; z-index: 60; display: flex; flex-direction: column; transform: translateY(100%); transition: transform 0.3s ease; }
        .upload-overlay.open { transform: translateY(0); }
        
        .profile-overlay { position: fixed; inset: 0; background: #111; z-index: 60; overflow-y: auto; transform: translateX(100%); transition: transform 0.3s ease; }
        .profile-overlay.open { transform: translateX(0); }

        .loading-spinner { border: 4px solid rgba(255,255,255,0.1); width: 36px; height: 36px; border-radius: 50%; border-left-color: var(--acc-500); animation: spin 1s linear infinite; }
        
        .heart-animation {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 80px;
            color: var(--acc-500);
            pointer-events: none;
            z-index: 30;
            filter: drop-shadow(0 0 10px rgba(224, 17, 95, 0.5));
        }
        .animate-heart { animation: popHeart 0.8s ease-out forwards; }
        @keyframes popHeart {
            0% { transform: translate(-50%, -50%) scale(0) rotate(-15deg); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.2) rotate(0deg); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1) rotate(15deg); opacity: 0; }
        }
    </style>
</head>
<body class="bg-black text-white font-sans antialiased selection:bg-ruby-500 selection:text-white">

    <!-- Top Bar -->
    <div class="fixed top-0 left-0 w-full z-40 p-4 pt-8 flex justify-between items-center bg-gradient-to-b from-black/80 to-transparent pointer-events-none">
        <a href="index.html" class="pointer-events-auto text-white/80 hover:text-white font-bold drop-shadow-md"><i class="fas fa-arrow-left mr-1"></i> Chat</a>
        <div class="flex gap-4 font-bold text-lg drop-shadow-md pointer-events-auto">
            <button class="text-white/60 hover:text-white transition-colors" onclick="switchFeed('following')">Following</button>
            <div class="w-[1px] h-4 bg-white/30 self-center"></div>
            <button class="text-white border-b-2 border-white pb-0.5" onclick="switchFeed('foryou')">For You</button>
        </div>
        <div class="w-16"></div> <!-- Spacer for balance -->
    </div>

    <!-- MAIN FEED -->
    <div id="feed-container" class="feed-container">
        <div id="loading-indicator" class="h-screen w-full flex flex-col items-center justify-center">
            <div class="loading-spinner mb-4"></div>
            <p class="text-gray-500 text-sm font-bold tracking-widest">LOADING RUBYTOK...</p>
        </div>
    </div>

    <!-- Bottom Nav -->
    <div class="nav-bottom">
        <div class="nav-btn active" onclick="scrollToTop()"><i class="fas fa-home"></i></div>
        <div class="nav-btn" onclick="openSearch()"><i class="fas fa-search"></i></div>
        <div class="upload-btn-container" onclick="openUpload()">
            <div class="upload-btn-inner"><i class="fas fa-plus"></i></div>
        </div>
        <div class="nav-btn" onclick="showToast('Inbox coming soon!')"><i class="fas fa-comment-dots"></i></div>
        <div class="nav-btn" onclick="openMyProfile()"><i class="fas fa-user"></i></div>
    </div>

    <!-- COMMENTS MODAL -->
    <div id="comments-modal" class="slide-up-modal">
        <div class="modal-handle" onclick="closeComments()"></div>
        <div class="text-center font-bold text-sm pb-2 border-b border-gray-800"><span id="comment-count-header">0</span> comments <button onclick="closeComments()" class="absolute right-4 text-gray-400"><i class="fas fa-times"></i></button></div>
        <div id="comments-list" class="flex-1 overflow-y-auto p-4 space-y-4">
            <!-- Comments injected here -->
        </div>
        <div class="comment-input-area pb-6">
            <input type="text" id="comment-input" class="flex-1 bg-gray-800 border-none rounded-full px-4 py-2 text-sm text-white focus:ring-1 focus:ring-ruby-500 outline-none" placeholder="Add comment...">
            <button onclick="postComment()" class="text-ruby-500 font-bold p-2"><i class="fas fa-arrow-up"></i></button>
        </div>
    </div>

    <!-- UPLOAD MODAL -->
    <div id="upload-modal" class="upload-overlay">
        <div class="p-4 flex justify-between items-center bg-black border-b border-gray-900">
            <button onclick="closeUpload()" class="text-gray-400 text-lg"><i class="fas fa-times"></i></button>
            <h2 class="font-bold text-lg">Post to RubyTok</h2>
            <div class="w-8"></div>
        </div>
        <div class="flex-1 p-6 flex flex-col items-center justify-center space-y-6">
            <div id="upload-preview-container" class="w-full max-w-xs aspect-[9/16] bg-gray-900 rounded-xl border-2 border-dashed border-gray-700 flex flex-col items-center justify-center cursor-pointer relative overflow-hidden" onclick="document.getElementById('video-file').click()">
                <div id="upload-placeholder" class="text-center p-4">
                    <i class="fas fa-cloud-upload-alt text-4xl text-ruby-500 mb-2"></i>
                    <p class="text-gray-400 font-bold">Select Video</p>
                    <p class="text-xs text-gray-600 mt-2">MP4/WebM up to 8MB</p>
                </div>
                <video id="upload-preview" class="absolute inset-0 w-full h-full object-cover hidden" loop playsinline muted></video>
                <input type="file" id="video-file" accept="video/*" class="hidden" onchange="handleFileSelect(this)">
            </div>
            
            <div class="w-full max-w-md space-y-4">
                <div>
                    <label class="text-xs font-bold text-gray-500 uppercase">Caption</label>
                    <textarea id="upload-caption" rows="3" class="w-full bg-gray-900 border border-gray-800 rounded-lg p-3 text-white focus:border-ruby-500 outline-none resize-none" placeholder="Describe your video... #RubyChat"></textarea>
                </div>
                <button onclick="processUpload()" id="publish-btn" class="w-full bg-ruby-500 hover:bg-ruby-600 text-white font-bold py-4 rounded-xl shadow-lg shadow-ruby-500/20 transition-all">POST VIDEO</button>
            </div>
        </div>
    </div>

    <!-- PROFILE MODAL -->
    <div id="profile-overlay" class="profile-overlay">
        <div class="p-4 flex justify-between items-center sticky top-0 bg-black/90 backdrop-blur-md z-30">
            <button onclick="closeProfile()" class="text-white text-lg"><i class="fas fa-chevron-left"></i></button>
            <h2 class="font-bold" id="profile-header-name">Profile</h2>
            <div class="w-6"></div>
        </div>
        <div class="flex flex-col items-center pt-4 pb-8">
            <img id="profile-pfp" src="" class="w-24 h-24 rounded-full border-2 border-gray-800 object-cover mb-3">
            <h1 id="profile-username" class="text-xl font-bold mb-1">@user</h1>
            <div class="flex gap-6 mt-4 mb-6 text-center">
                <div><div class="font-bold text-lg" id="stat-following">0</div><div class="text-xs text-gray-500">Following</div></div>
                <div><div class="font-bold text-lg" id="stat-followers">0</div><div class="text-xs text-gray-500">Followers</div></div>
                <div><div class="font-bold text-lg" id="stat-likes">0</div><div class="text-xs text-gray-500">Likes</div></div>
            </div>
            <div class="flex gap-2 mb-6">
                <button id="follow-btn" onclick="toggleFollow()" class="bg-ruby-500 px-8 py-2 rounded-md font-bold text-sm">Follow</button>
                <button class="bg-gray-800 px-3 py-2 rounded-md"><i class="fas fa-share"></i></button>
            </div>
        </div>
        <div class="border-t border-gray-900">
            <div class="flex text-center border-b border-gray-900">
                <div class="flex-1 py-3 border-b-2 border-white text-white cursor-pointer"><i class="fas fa-th"></i></div>
                <div class="flex-1 py-3 text-gray-600 cursor-pointer"><i class="fas fa-heart"></i></div>
            </div>
            <div id="profile-grid" class="grid grid-cols-3 gap-0.5 p-0.5">
                <!-- Grid items injected -->
            </div>
        </div>
    </div>

    <div id="toast-container" class="fixed top-20 left-1/2 transform -translate-x-1/2 z-[200] flex flex-col gap-2 w-max pointer-events-none"></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";import{getFirestore,collection,doc,addDoc,getDoc,getDocs,updateDoc,deleteDoc,onSnapshot,query,where,orderBy,limit,serverTimestamp,increment,arrayUnion,arrayRemove,setDoc}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
const config={apiKey:"AIzaSyC-Ti6kJB_bgdeC0I_1Pt9Bl3XZp7pTjoU",authDomain:"cartoony-chat.firebaseapp.com",databaseURL:"https://cartoony-chat-default-rtdb.europe-west1.firebasedatabase.app",projectId:"cartoony-chat",storageBucket:"cartoony-chat.firebasestorage.app",messagingSenderId:"827018960215",appId:"1:827018960215:web:0e0c2436c9c4e1dceb7212",measurementId:"G-HF16NJSQ16"};
const app=initializeApp(config),auth=getAuth(app),db=getFirestore(app);

let curUser = null;
let userData = null;
let currentVideos = [];
let commentsUnsub = null;
let activeVideoId = null;
let currentProfileId = null;

// Initialization
onAuthStateChanged(auth, async u => {
    if(u) {
        curUser = u;
        const s = await getDoc(doc(db, "users", u.uid));
        if(s.exists()) userData = s.data();
        initFeed();
    } else {
        window.location.href = 'index.html'; // Redirect to main app to login
    }
});

function initFeed() {
    const q = query(collection(db, "rubytok_posts"), orderBy("timestamp", "desc"), limit(20));
    onSnapshot(q, (snapshot) => {
        const posts = [];
        snapshot.forEach(doc => posts.push({id: doc.id, ...doc.data()}));
        renderFeed(posts);
    });
}

function renderFeed(posts) {
    const container = document.getElementById('feed-container');
    const loading = document.getElementById('loading-indicator');
    if(loading) loading.remove();
    
    // Simple diffing: if posts changed significantly, re-render. For TikTok stream, appending is better usually, but here we just refresh for simplicity.
    // In a real app, you'd prepend new ones and append old ones.
    
    container.innerHTML = posts.map(post => createVideoSlide(post)).join('');
    
    // Intersection Observer for AutoPlay
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            const vid = entry.target.querySelector('video');
            if(entry.isIntersecting) {
                vid.play().catch(e => console.log("Autoplay blocked"));
                activeVideoId = entry.target.dataset.id;
            } else {
                vid.pause();
                vid.currentTime = 0;
            }
        });
    }, { threshold: 0.6 });

    document.querySelectorAll('.video-item').forEach(el => observer.observe(el));
}

function createVideoSlide(post) {
    const isLiked = post.likes && post.likes.includes(curUser.uid);
    const pfp = post.userPhoto || "https://picsum.photos/100";
    
    return `
    <div class="video-item" data-id="${post.id}" ondblclick="handleDoubleTap(this, '${post.id}')">
        <video class="video-player" src="${post.videoURL}" loop playsinline onclick="togglePlay(this)"></video>
        <div class="absolute inset-0 bg-gradient-to-b from-black/20 via-transparent to-black/60 pointer-events-none"></div>
        
        <!-- Right Sidebar -->
        <div class="sidebar-right">
            <div class="sidebar-icon" onclick="openProfile('${post.uid}')">
                <div class="relative">
                    <img src="${pfp}" class="w-[45px] h-[45px] rounded-full border-2 border-white object-cover">
                    <div class="absolute -bottom-2 left-1/2 transform -translate-x-1/2 bg-ruby-500 rounded-full w-5 h-5 flex items-center justify-center text-[10px]"><i class="fas fa-plus"></i></div>
                </div>
            </div>
            
            <div class="sidebar-icon" onclick="toggleLike('${post.id}')">
                <i class="fas fa-heart ${isLiked ? 'text-ruby-500' : 'text-white'}" id="like-icon-${post.id}"></i>
                <span class="icon-label" id="like-count-${post.id}">${post.likes ? post.likes.length : 0}</span>
            </div>
            
            <div class="sidebar-icon" onclick="openComments('${post.id}')">
                <i class="fas fa-comment-dots text-white"></i>
                <span class="icon-label">${post.commentsCount || 0}</span>
            </div>
            
            <div class="sidebar-icon" onclick="shareVideo('${post.id}')">
                <i class="fas fa-share text-white"></i>
                <span class="icon-label">Share</span>
            </div>

            <div class="sidebar-icon disc-animation">
                <div class="w-10 h-10 bg-gray-800 rounded-full border-4 border-gray-900 flex items-center justify-center overflow-hidden">
                    <img src="${pfp}" class="w-full h-full object-cover opacity-70">
                </div>
            </div>
        </div>
        
        <!-- Bottom Info -->
        <div class="bottom-info">
            <div class="font-bold text-lg mb-1 drop-shadow-md cursor-pointer" onclick="openProfile('${post.uid}')">@${post.username}</div>
            <div class="text-sm text-gray-100 mb-2 drop-shadow-md">${esc(post.caption)}</div>
            <div class="flex items-center gap-2 text-xs font-bold text-white/80">
                <i class="fas fa-music"></i> <div class="w-32 overflow-hidden whitespace-nowrap"><div class="animate-marquee">Original Sound - ${post.username}</div></div>
            </div>
        </div>

        <!-- Heart Animation Container -->
        <div class="heart-container absolute inset-0 pointer-events-none overflow-hidden"></div>
    </div>
    `;
}

// Global functions attached to window
window.togglePlay = (vid) => {
    if(vid.paused) vid.play();
    else vid.pause();
};

window.handleDoubleTap = (el, id) => {
    // Show heart animation
    const container = el.querySelector('.heart-container');
    const heart = document.createElement('i');
    heart.className = 'fas fa-heart heart-animation animate-heart';
    container.appendChild(heart);
    setTimeout(() => heart.remove(), 1000);
    
    // Like logic
    toggleLike(id, true);
};

window.toggleLike = async (id, forceLike = false) => {
    const ref = doc(db, "rubytok_posts", id);
    const snap = await getDoc(ref);
    if(!snap.exists()) return;
    
    const likes = snap.data().likes || [];
    const isLiked = likes.includes(curUser.uid);
    const icon = document.getElementById(`like-icon-${id}`);
    const count = document.getElementById(`like-count-${id}`);
    
    if (forceLike && isLiked) return; // Already liked

    if (isLiked) {
        await updateDoc(ref, { likes: arrayRemove(curUser.uid) });
        if(icon) { icon.classList.remove('text-ruby-500'); icon.classList.add('text-white'); }
        if(count) count.innerText = likes.length - 1;
    } else {
        await updateDoc(ref, { likes: arrayUnion(curUser.uid) });
        if(icon) { icon.classList.add('text-ruby-500', 'animate-like-bounce'); icon.classList.remove('text-white'); }
        if(count) count.innerText = likes.length + 1;
        // Notify author
        if(snap.data().uid !== curUser.uid) {
            addDoc(collection(db, "users", snap.data().uid, "notifications"), {
                text: `${userData.username} liked your RubyTok video!`,
                timestamp: serverTimestamp(),
                read: false
            });
        }
    }
};

// COMMENTS
window.openComments = (id) => {
    document.getElementById('comments-modal').classList.add('open');
    activeVideoId = id;
    loadComments(id);
};

window.closeComments = () => {
    document.getElementById('comments-modal').classList.remove('open');
    if(commentsUnsub) commentsUnsub();
};

function loadComments(id) {
    const q = query(collection(db, "rubytok_posts", id, "comments"), orderBy("timestamp", "desc"));
    commentsUnsub = onSnapshot(q, (snap) => {
        document.getElementById('comment-count-header').innerText = snap.size;
        document.getElementById('comments-list').innerHTML = snap.docs.map(d => {
            const c = d.data();
            const time = c.timestamp ? new Date(c.timestamp.toDate()).toLocaleDateString() : 'Just now';
            return `
            <div class="flex gap-3 mb-4">
                <img src="${c.userPhoto || 'https://picsum.photos/50'}" class="w-8 h-8 rounded-full bg-gray-700">
                <div class="flex-1">
                    <div class="text-xs font-bold text-gray-400 mb-0.5">${c.username} <span class="font-normal text-gray-600 ml-1">${time}</span></div>
                    <div class="text-sm text-gray-200">${esc(c.text)}</div>
                </div>
            </div>`;
        }).join('');
    });
}

window.postComment = async () => {
    const input = document.getElementById('comment-input');
    const txt = input.value.trim();
    if(!txt || !activeVideoId) return;
    input.value = '';
    
    try {
        await addDoc(collection(db, "rubytok_posts", activeVideoId, "comments"), {
            text: txt,
            uid: curUser.uid,
            username: userData.username,
            userPhoto: userData.photoURL || "",
            timestamp: serverTimestamp()
        });
        await updateDoc(doc(db, "rubytok_posts", activeVideoId), {
            commentsCount: increment(1)
        });
    } catch(e) { console.error(e); }
};

// UPLOAD
window.openUpload = () => document.getElementById('upload-modal').classList.add('open');
window.closeUpload = () => {
    document.getElementById('upload-modal').classList.remove('open');
    document.getElementById('upload-preview').src = "";
    document.getElementById('upload-preview').classList.add('hidden');
    document.getElementById('upload-placeholder').classList.remove('hidden');
    document.getElementById('video-file').value = "";
    document.getElementById('upload-caption').value = "";
    document.getElementById('publish-btn').disabled = false;
    document.getElementById('publish-btn').innerText = "POST VIDEO";
};

window.handleFileSelect = (input) => {
    const file = input.files[0];
    if(file) {
        if(file.size > 8 * 1024 * 1024) { // 8MB Limit for Base64 safety
            showToast("Video too large! Max 8MB.");
            input.value = "";
            return;
        }
        const url = URL.createObjectURL(file);
        const vid = document.getElementById('upload-preview');
        vid.src = url;
        vid.classList.remove('hidden');
        document.getElementById('upload-placeholder').classList.add('hidden');
        vid.play();
    }
};

window.processUpload = async () => {
    const fileInput = document.getElementById('video-file');
    const caption = document.getElementById('upload-caption').value;
    
    if(!fileInput.files[0]) { showToast("Select a video first!"); return; }
    
    const btn = document.getElementById('publish-btn');
    btn.disabled = true;
    btn.innerText = "Processing...";
    
    // Convert to Base64 (Not efficient for prod, but meets "single file" requirement)
    const reader = new FileReader();
    reader.readAsDataURL(fileInput.files[0]);
    reader.onload = async () => {
        try {
            const base64Video = reader.result;
            await addDoc(collection(db, "rubytok_posts"), {
                videoURL: base64Video,
                caption: caption,
                uid: curUser.uid,
                username: userData.username,
                userPhoto: userData.photoURL || "",
                likes: [],
                reposts: [],
                commentsCount: 0,
                timestamp: serverTimestamp()
            });
            showToast("Video Posted!", false);
            closeUpload();
            // Scroll to top
            document.getElementById('feed-container').scrollTop = 0;
        } catch(e) {
            console.error(e);
            showToast("Upload Failed. File might be too big.");
            btn.disabled = false;
            btn.innerText = "POST VIDEO";
        }
    };
    reader.onerror = () => {
        showToast("Error reading file.");
        btn.disabled = false;
        btn.innerText = "POST VIDEO";
    };
};

// PROFILE
window.openProfile = async (uid) => {
    currentProfileId = uid;
    const overlay = document.getElementById('profile-overlay');
    overlay.classList.add('open');
    
    // Get User Data
    const uSnap = await getDoc(doc(db, "users", uid));
    if(uSnap.exists()) {
        const d = uSnap.data();
        document.getElementById('profile-username').innerText = '@' + d.username;
        document.getElementById('profile-header-name').innerText = d.username;
        document.getElementById('profile-pfp').src = d.photoURL || "https://picsum.photos/100";
        // Mock stats for now or fetch real ones
        document.getElementById('stat-followers').innerText = d.followers ? d.followers.length : 0;
    }
    
    // Get User Videos
    const q = query(collection(db, "rubytok_posts"), where("uid", "==", uid), orderBy("timestamp", "desc"), limit(20));
    const vSnap = await getDocs(q);
    const grid = document.getElementById('profile-grid');
    document.getElementById('stat-likes').innerText = 0; // Calc total likes
    
    let totalLikes = 0;
    
    if(vSnap.empty) {
        grid.innerHTML = '<div class="col-span-3 text-center py-10 text-gray-500">No videos yet.</div>';
    } else {
        grid.innerHTML = vSnap.docs.map(doc => {
            const d = doc.data();
            if(d.likes) totalLikes += d.likes.length;
            return `
            <div class="aspect-[9/16] bg-gray-800 relative cursor-pointer" onclick="closeProfile(); scrollToVideo('${doc.id}')">
                <video src="${d.videoURL}" class="w-full h-full object-cover"></video>
                <div class="absolute bottom-1 left-1 text-xs font-bold drop-shadow-md"><i class="fas fa-play text-[10px]"></i> ${d.likes ? d.likes.length : 0}</div>
            </div>`;
        }).join('');
    }
    document.getElementById('stat-likes').innerText = totalLikes;
    
    // Show edit/follow button logic
    const fb = document.getElementById('follow-btn');
    if(uid === curUser.uid) {
        fb.innerText = "Edit Profile";
        fb.onclick = () => showToast("Edit via Chat Settings");
    } else {
        // Check if following logic here
        fb.innerText = "Follow";
    }
};

window.closeProfile = () => document.getElementById('profile-overlay').classList.remove('open');

window.openMyProfile = () => openProfile(curUser.uid);

window.scrollToTop = () => {
    document.getElementById('feed-container').scrollTo({top: 0, behavior: 'smooth'});
};

window.showToast = (msg, err = false) => {
    const c = document.getElementById('toast-container');
    const t = document.createElement('div');
    t.className = `px-4 py-2 rounded-full text-sm font-bold text-white shadow-lg ${err ? 'bg-red-500' : 'bg-ruby-500'} transition-opacity duration-300`;
    t.innerText = msg;
    c.appendChild(t);
    setTimeout(() => { t.style.opacity = '0'; setTimeout(()=>t.remove(), 300); }, 2000);
};

window.switchFeed = (type) => {
    showToast(`Switched to ${type === 'foryou' ? 'For You' : 'Following'}`);
    // Here you would change the firestore query
};

function esc(t) { return t ? t.replace(/[&<>"']/g, x => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[x])) : ''; }

</script>
